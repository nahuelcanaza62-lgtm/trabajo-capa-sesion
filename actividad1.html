<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad 1 - Completar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="encabezado compacto">
    <p class="etiqueta">MODELO OSI</p>
    <h1>Completá las oraciones</h1>
    <p class="bajada">Escribí lo que falta en cada frase.</p>
  </header>
  <main class="contenedor">
    <section class="tarjeta preguntas">
      <p class="instruccion">Completá las frases.</p>
      <form>
        <label class="pregunta">1. El modelo OSI organiza la comunicación mediante un total de
          <input type="text" placeholder="Tu respuesta" aria-label="Respuesta 1"> capas.
        </label>
        <label class="pregunta">2. La capa de sesión pertenece al nivel número
          <input type="text" placeholder="Tu respuesta" aria-label="Respuesta 2">.
        </label>
        <label class="pregunta">3. Una de sus funciones es establecer, mantener y
          <input type="text" placeholder="Tu respuesta" aria-label="Respuesta 3"> las sesiones.
        </label>
        <label class="pregunta">4. La capa de sesión puede controlar el
          <input type="text" placeholder="Tu respuesta" aria-label="Respuesta 4"> para organizar el intercambio de información.
        </label>
        <label class="pregunta">5. Los puntos de sincronización permiten
          <input type="text" placeholder="Tu respuesta" aria-label="Respuesta 5"> una transmisión desde un punto anterior si ocurre un problema.
        </label>
      </form>
      <div class="botones">
        <a class="boton secundario" href="index.html">Volver al inicio</a>
        <a class="boton principal" href="respuestas1.html">Mostrar respuestas</a>
        <a class="boton secundario" href="actividad2.html">Siguiente actividad →</a>
      </div>
    </section>
  </main>
</body>
</html>
